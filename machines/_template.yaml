# Machine configuration template.
# Copy this file and rename it after your machine (e.g. my-laptop.yaml, my-cluster.yaml).
# Machine configs ARE tracked in this repo since it is personal. Absolute paths are acceptable.
#
# Generate a first guess automatically:
#   bin/lego-detect-machine --write

# ---------- Identity ----------
nickname: ""               # Short name for directory naming (e.g. laptop, cluster1)
hostnames: []              # List of `hostname -s` outputs for auto-detection (e.g. [my-laptop])

# ---------- Remote access (optional) ----------
ssh_alias: ""              # ~/.ssh/config alias to reach this machine (e.g. my-cluster);
                           # leave empty for local machines (no ssh relay)
workspace: ""              # Absolute path of the workspace on this machine
                           # (e.g. /home/<user>/lego-world); fallback: dirname(legoesm_dir)

# ---------- Scheduler ----------
scheduler: null            # null | slurm | oar | pbs | lsf
scheduler_partition: ""
scheduler_account: ""
scheduler_walltime: "01:00:00"   # SLURM --time / appended to the OAR -l line
scheduler_nodes: 1
scheduler_tasks_per_node: 1
scheduler_mem: ""          # Memory per job (e.g. "64000" for 64 GB); empty = scheduler default
scheduler_gres: ""         # Generic resources (e.g. "gpu:1"); empty = none
scheduler_qos: ""          # QOS (e.g. "longjobs", "largemem"); empty = default
scheduler_output: ""       # Stdout pattern (e.g. "slurm-%j.out"); empty = scheduler default
scheduler_error: ""        # Stderr pattern (e.g. "slurm-%j.err"); empty = merged with output

# ---------- OAR ----------
# Used when scheduler: oar. The runner emits #OAR directives in run.sh;
# submit with: cd <experiment-dir> && oarsub -S run.sh
# Job logs land as OAR.<name>.<jobid>.stdout/.stderr in the submission
# directory; monitor with oarstat -u.
oar_project: ""            # Project/allocation name (e.g. "my-project") → --project
oar_resources: "/nodes=1"  # Resource tree (e.g. "/nodes=1/gpu=1" GPU slice); walltime appended from scheduler_walltime
oar_properties: ""         # SQL WHERE clause on node properties (e.g. "gpumodel = 'V100'").
                           # NOTE: single quotes inside are fine, but do NOT wrap the whole
                           # clause in double quotes — the #OAR -p directive parser passes
                           # the value verbatim and quoted input aborts the submission
oar_types: []              # OAR job types (e.g. ["devel"], ["besteffort"])

# ---------- Devices ----------
devices: "auto"            # auto | cpu | gpu | tpu
n_devices: "auto"         # auto or integer
precision: "mixed"         # fp32 | fp64 | mixed

# ---------- Paths ----------
# Adjust these to your machine's filesystem layout.
data_root: ""              # DATA_ROOT for data_catalog.yaml files (ERA5, OMIP, etc.)
                           # If empty, falls back to $LEGOESM_DATA_DIR or ./data
legoesm_dir: ""            # Path to legoESM checkout (if not auto-detected)
output_root: "./output"    # Root for experiment output

# ---------- Environment ----------
# Commands to set up the environment before running.
# Example for a module/conda-based setup:
# env_setup:
#   - "module load python/3.12"
#   - "conda activate legoesm"
env_setup: []
